name: "🔌 Github CI - Actions"

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: 🦀 Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 🛡️ Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
          disable-telemetry: true

      - name: 📁 Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 🛠️ Set up Go toolchain
        uses: actions/setup-go@v6.4.0
        with:
          go-version: "1.26.1"
          cache-dependency-path: "**/go.sum"

      - name: 🔍 Go vet
        run: |
          for dir in ci-status fix-notifier label-pr-issue release-notes unreleased-commits versions-dropdown; do
            go vet ./${dir}/...
          done

      - name: 🧪 Run tests
        run: |
          for dir in ci-status fix-notifier label-pr-issue release-notes unreleased-commits versions-dropdown; do
            go test ./${dir}/...
          done

  check-spell:
    name: 📝 Check spelling
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 🛡️ Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
          disable-telemetry: true

      - name: 📁 Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 📝 Check spelling
        uses: crate-ci/typos@cf5f1c29a8ac336af8568821ec41919923b05a83 # v1.45.1
